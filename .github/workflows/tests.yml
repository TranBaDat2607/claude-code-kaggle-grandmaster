name: tests

# A PR's commits are tested by the pull_request event; pushes are tested on main only, so a PR branch's push does
# not run the same matrix a second time.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt lightgbm
      - name: Test
        run: python -m pytest tests -q -n auto

  # docs/skill-authoring.md: Anthropic's skill guidance as checks, in its own job so a PR shows the standard by name
  # and fails in seconds when a skill or agent breaks it.
  skill-standard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pytest pyyaml numpy pandas
      - name: Skill authoring standard
        run: python -m pytest tests/test_skill_standard.py tests/test_skills.py tests/test_compaction.py -q -rs

  # Claude Code's own validator parses skill and agent frontmatter as the runtime does: a file it cannot parse
  # loads with empty metadata, silently (#120). It needs no login.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the plugin
        run: claude plugin validate plugins/kaggle-grandmaster

  # The plugin as users get it: installed from the marketplace into a fresh project (tests/test_install.py), not
  # loaded with --plugin-dir. Catches what only an install breaks: a file missing from the cache copy, bin/kgkit's
  # mode, KGKIT_HOME resolution. Its own Claude config dir; needs no login and no Kaggle account.
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          pip install pytest numpy pandas
          npm install -g @anthropic-ai/claude-code
      - name: Install the plugin from the marketplace and check it
        env:
          KGKIT_INSTALL_TEST: "1"
        run: python -m pytest tests/test_install.py -q -rs
